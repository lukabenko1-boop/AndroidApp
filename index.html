<title>KI BLOBS 3D — Aerial Brawl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:#05060d; overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; color:#eaf0ff;
    touch-action:none; user-select:none; -webkit-user-select:none;}
  #stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
  #wrap{position:relative; width:100%; height:100%;}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block;}
  #pad{position:absolute; inset:0; pointer-events:none;}
  .ctl{position:absolute; pointer-events:auto;}
  #stick{left:3.5%; bottom:6%; width:34vmin; height:34vmin; max-width:190px; max-height:190px;
    border-radius:50%; background:rgba(140,160,220,.08); border:2px solid rgba(160,180,240,.22); touch-action:none;}
  #nub{position:absolute; left:50%; top:50%; width:42%; height:42%; transform:translate(-50%,-50%);
    border-radius:50%; background:radial-gradient(circle at 35% 30%,#9fb4ff,#4a5cc0);
    border:2px solid rgba(255,255,255,.35); box-shadow:0 4px 14px rgba(0,0,0,.4);}
  #btns{right:3%; bottom:5%; width:46vmin; height:46vmin; max-width:260px; max-height:260px;}
  .btn{position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:min(3.1vmin,15px); color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5);
    touch-action:none; border:2px solid rgba(255,255,255,.25); box-shadow:0 4px 12px rgba(0,0,0,.35);}
  .btn:active,.btn.on{filter:brightness(1.35);}
  #bPunch{width:42%;height:42%;right:52%;top:1%;background:radial-gradient(circle at 35% 30%,#ff8a7a,#c9372a);}
  #bBlast{width:42%;height:42%;right:1%;top:52%;transform:translateY(-50%);background:radial-gradient(circle at 35% 30%,#7ad0ff,#2570c9);}
  #bCharge{width:42%;height:42%;right:52%;bottom:1%;background:radial-gradient(circle at 35% 30%,#ffe07a,#d09a1a);}
  #bBlock{width:42%;height:42%;left:1%;top:52%;transform:translateY(-50%);background:radial-gradient(circle at 35% 30%,#b9a6ff,#6a4fd0);}
  #bBeam{width:34%;height:34%;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#fff2b0,#e08a2a);font-size:min(2.6vmin,13px);}
  #bBlast:active,#bBlast.on,#bBlock:active,#bBlock.on{transform:translateY(-50%) scale(.95);}
  #bBeam:active,#bBeam.on{transform:translate(-50%,-50%) scale(.94);}
  #hint{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);font-size:11px;color:#8A93B2;text-align:center;pointer-events:none;width:96%;}
  @media (pointer:coarse){ #hint{display:none;} }
  @media (pointer:fine){ #pad{opacity:.30;} }
</style>

<div id="stage"><div id="wrap">
  <canvas id="cv"></canvas>
  <div id="pad">
    <div id="stick" class="ctl"><div id="nub"></div></div>
    <div id="btns" class="ctl">
      <div class="btn" id="bPunch">PUNCH</div>
      <div class="btn" id="bBlast">BLAST</div>
      <div class="btn" id="bCharge">CHARGE</div>
      <div class="btn" id="bBlock">BLOCK</div>
      <div class="btn" id="bBeam">BEAM</div>
    </div>
  </div>
  <div id="hint">MOVE WASD/Arrows (2-axis: ←→ + fly up/down) · <b>J</b> Punch · <b>K</b> Blast · <b>L</b> Charge · <b>I</b> Beam · <b>Shift</b> Block · <b>T</b> Transform · <b>Space</b> Start</div>
</div></div>

<script>
"use strict";
(function(){
// ================================================== CONFIG
const W=960,H=540,FOC=560;
const AX0=-820,AX1=820,AZ0=40,AZ1=1520,YMAX=460;
const PLANE_Z=170;   // fighters are locked to this depth plane (2.5D like Lemming Ball Z)
const GX=42,GZ=38;
const CFG={ accel:1750, maxSpd:345, drag:3.2, grav:640, hover:104, altK:5.2,
  hp:100, ki:100, blastCost:20, chargeRate:44, regen:6, ocRate:40, ocDecay:7,
  meleeDmg:9, blastDmg:11, blockMul:0.26, meleeCd:0.32, blastCd:0.40, meleeRange:112, hitstun:0.22,
  meleeKnock:380, blastKnock:320, blastSpd:660, blastR:14, slamSpd:230, slamK:0.05,
  beamMinCost:24, beamCost:40, beamDps:52, beamDur:0.5, beamThick:17, beamChargeRate:0.85, beamKnock:250, beamRange:1900,
  tierMul:0.12, surgeMul:0.35 };
const FORMS=[ {n:'',mul:1,spd:1,drain:0}, {n:'ASCENDED',mul:1.35,spd:1.16,drain:8}, {n:'SUPER',mul:1.7,spd:1.32,drain:14} ];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ================================================== VEC
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const vlen=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=vlen(a)||1;return [a[0]/l,a[1]/l,a[2]/l];};
const lerp=(a,b,t)=>a+(b-a)*t;

// ================================================== CANVAS
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function resize(){const r=document.getElementById('wrap').getBoundingClientRect();const d=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d);}
window.addEventListener('resize',resize);resize();
function vp(){const s=Math.min(cv.width/W,cv.height/H);return {s,ox:(cv.width-W*s)/2,oy:(cv.height-H*s)/2};}

// ================================================== CAMERA
let cam={ex:0,ey:420,ez:-560,tx:0,ty:80,tz:400},CAM=null;
function camUpdate(dt){const midX=(P1.x+P2.x)/2,midY=(P1.y+P2.y)/2;
  const sep=Math.hypot(P1.x-P2.x,P1.y-P2.y),zoom=clamp(sep,420,1400);
  const dex=midX, dey=midY+70+zoom*0.14, dez=PLANE_Z-(560+zoom*0.7), dtx=midX, dty=midY*0.75+40, dtz=PLANE_Z;
  const k=1-Math.exp(-3.5*dt);
  cam.ex=lerp(cam.ex,dex,k);cam.ey=lerp(cam.ey,dey,k);cam.ez=lerp(cam.ez,dez,k);
  cam.tx=lerp(cam.tx,dtx,k);cam.ty=lerp(cam.ty,dty,k);cam.tz=lerp(cam.tz,dtz,k);}
function buildCam(){const eye=[cam.ex,cam.ey,cam.ez],fz=norm(sub([cam.tx,cam.ty,cam.tz],eye));
  const fx=norm(cross([0,1,0],fz)),fy=cross(fz,fx);CAM={eye,fx,fy,fz};}
function project(x,y,z){const d=[x-CAM.eye[0],y-CAM.eye[1],z-CAM.eye[2]];
  const vz=dot(d,CAM.fz);if(vz<8)return null;return {sx:W/2+dot(d,CAM.fx)*FOC/vz,sy:H/2-dot(d,CAM.fy)*FOC/vz,vz,sc:FOC/vz};}

// ================================================== AUDIO
let AC=null;
function aInit(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function beep(t,f0,f1,d,v,w){if(!AC)return;const s=AC.currentTime+(w||0);const o=AC.createOscillator(),g=AC.createGain();
  o.type=t;o.frequency.setValueAtTime(f0,s);o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),s+d);
  g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(v,s+0.008);g.gain.exponentialRampToValueAtTime(0.0001,s+d);
  o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+d+0.02);}
function noise(d,v,f){if(!AC)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),dt=b.getChannelData(0);
  for(let i=0;i<n;i++)dt[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);const bf=AC.createBiquadFilter();bf.type='bandpass';bf.frequency.value=f||900;
  s.connect(bf);bf.connect(g);g.connect(AC.destination);s.start(t);}
const SFX={punch:()=>beep('square',220,90,.09,.18),blast:()=>beep('sawtooth',680,180,.22,.15),
  hit:()=>{noise(.12,.25,800);beep('square',160,60,.1,.12);},charge:()=>beep('sine',140,320,.14,.05),
  beam:()=>{beep('sawtooth',300,900,.5,.14);noise(.5,.08,1400);},boom:()=>{noise(.3,.3,300);beep('sine',120,40,.3,.16);},
  trans:()=>{beep('sawtooth',200,1400,.6,.2);noise(.5,.15,1800);},ko:()=>{beep('sawtooth',400,60,.6,.2);noise(.5,.2,500);}};

// ================================================== INPUT
const input={mx:0,mz:0,charge:false,block:false,beam:false,punchQ:false,blastQ:false,transformQ:false,start:false};
const keys={};
const KM={ArrowUp:[0,1],ArrowDown:[0,-1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,1],s:[0,-1],a:[-1,0],d:[1,0]};
window.addEventListener('keydown',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k in KM||k===' '||k==='Shift'||['j','k','l','i','t'].includes(k))e.preventDefault();
  if(keys[k])return;keys[k]=true;aInit();
  if(k==='j')input.punchQ=true;if(k==='k')input.blastQ=true;if(k==='t')input.transformQ=true;
  if(k==='l')input.charge=true;if(k==='i')input.beam=true;if(k==='Shift')input.block=true;if(k===' ')input.start=true;
},{passive:false});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false;
  if(k==='l')input.charge=false;if(k==='i')input.beam=false;if(k==='Shift')input.block=false;});
function keyMove(){let x=0,z=0;for(const k in KM){if(keys[k]){x+=KM[k][0];z+=KM[k][1];}}const m=Math.hypot(x,z);if(m>1){x/=m;z/=m;}return [x,z];}
const stick=document.getElementById('stick'),nub=document.getElementById('nub');let sid=null,tmx=0,tmz=0;
function sMove(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let px,py;
  if(e.touches){let f=null;for(const t of e.touches){if(t.identifier===sid){f=t;break;}}if(!f)return;px=f.clientX;py=f.clientY;}else{px=e.clientX;py=e.clientY;}
  let dx=px-cx,dy=py-cy;const mx=r.width*0.42,dd=Math.hypot(dx,dy);if(dd>mx){dx=dx/dd*mx;dy=dy/dd*mx;}
  nub.style.left=(50+dx/r.width*100)+'%';nub.style.top=(50+dy/r.height*100)+'%';tmx=dx/mx;tmz=-dy/mx;}
function sEnd(){sid=null;tmx=0;tmz=0;nub.style.left='50%';nub.style.top='50%';}
stick.addEventListener('pointerdown',e=>{aInit();sid=e.pointerId;stick.setPointerCapture(e.pointerId);sMove(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)sMove(e);});
stick.addEventListener('pointerup',sEnd);stick.addEventListener('pointercancel',sEnd);
function hb(id,on,off){const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();aInit();el.classList.add('on');on();el.setPointerCapture(e.pointerId);},{passive:false});
  const up=()=>{el.classList.remove('on');off&&off();};el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);}
hb('bPunch',()=>{input.punchQ=true;input.start=true;});hb('bBlast',()=>{input.blastQ=true;input.start=true;});
hb('bCharge',()=>{input.charge=true;input.start=true;},()=>{input.charge=false;});
hb('bBlock',()=>{input.block=true;input.start=true;},()=>{input.block=false;});
hb('bBeam',()=>{input.beam=true;input.start=true;},()=>{input.beam=false;});

// ================================================== TERRAIN (3D destructible heightmap, textured)
let hmap,scorch;const gi=(i,j)=>j*(GX+1)+i;
const gX=i=>AX0+(AX1-AX0)*i/GX, gZ=j=>AZ0+(AZ1-AZ0)*j/GZ;
const HILLS=[[-520,300,190,120],[380,470,175,96],[-120,220,150,70],[520,720,210,150],[-560,900,180,110],
  [180,1050,220,130],[-300,1250,200,120],[640,1300,190,100],[40,700,150,64],[-720,600,150,80]];
function buildTerrain(){hmap=new Float32Array((GX+1)*(GZ+1));scorch=new Float32Array((GX+1)*(GZ+1));
  for(let j=0;j<=GZ;j++)for(let i=0;i<=GX;i++){const x=gX(i),z=gZ(j);let h=6;
    for(const[hx,hz,hr,hh] of HILLS)h+=hh*Math.exp(-(((x-hx)**2+(z-hz)**2)/(2*hr*hr)));
    h+=Math.sin(x*0.02)*Math.cos(z*0.017)*7;hmap[gi(i,j)]=h;}}
function heightAt(x,z){const fx=clamp((x-AX0)/(AX1-AX0)*GX,0,GX-1e-3),fz=clamp((z-AZ0)/(AZ1-AZ0)*GZ,0,GZ-1e-3);
  const i=Math.floor(fx),j=Math.floor(fz),tx=fx-i,tz=fz-j;
  const a=hmap[gi(i,j)],b=hmap[gi(i+1,j)],c=hmap[gi(i,j+1)],d=hmap[gi(i+1,j+1)];
  return (a*(1-tx)+b*tx)*(1-tz)+(c*(1-tx)+d*tx)*tz;}
function carve(cx,cz,radius,depth){let any=false;
  for(let j=0;j<=GZ;j++)for(let i=0;i<=GX;i++){const dx=gX(i)-cx,dz=gZ(j)-cz,d2=dx*dx+dz*dz;
    if(d2<radius*radius){const f=1-Math.sqrt(d2)/radius,idx=gi(i,j),nh=Math.max(-40,hmap[idx]-depth*f);
      if(nh<hmap[idx]){hmap[idx]=nh;any=true;}scorch[idx]=Math.min(1,scorch[idx]+f*0.9);}}
  if(any)spawnDirt(cx,heightAt(cx,cz),cz,radius);}

// ================================================== PARTICLES
let projectiles=[],sparks=[],shake=0,flashScreen=0;
function spawnDirt(x,y,z,r){const n=Math.min(12,3+(r/26|0));
  for(let i=0;i<n;i++){const a=Math.random()*6.28,e=Math.random()*1.2+0.4,s=60+Math.random()*160;
    sparks.push({x:x+(Math.random()-.5)*r,y,z:z+(Math.random()-.5)*r,vx:Math.cos(a)*s,vy:Math.sin(e)*180+40,vz:Math.sin(a)*s,life:.6+Math.random()*.6,t:0,c:Math.random()<.5?'#6b4a34':'#7a5638',r:2.6+Math.random()*3.4});}}
function addSparks(x,y,z,n,c,spd){for(let i=0;i<n;i++){const a=Math.random()*6.28,e=Math.random()*3.14,s=spd*(.4+Math.random());
  sparks.push({x,y,z,vx:Math.cos(a)*Math.sin(e)*s,vy:Math.cos(e)*s+40,vz:Math.sin(a)*Math.sin(e)*s,life:.35+Math.random()*.3,t:0,c,r:2+Math.random()*2});}}

// ================================================== COLOR
function hx(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}
function shade(h,a){const[r,g,b]=hx(h),f=v=>clamp(Math.round(v+a),0,255);return `rgb(${f(r)},${f(g)},${f(b)})`;}
function ha(h,a){const[r,g,b]=hx(h);return `rgba(${r},${g},${b},${a})`;}
function mix(c1,c2,t){const a=hx(c1),b=hx(c2);return `rgb(${Math.round(a[0]+(b[0]-a[0])*t)},${Math.round(a[1]+(b[1]-a[1])*t)},${Math.round(a[2]+(b[2]-a[2])*t)})`;}
function lit(h,m){const[r,g,b]=hx(h),f=v=>clamp(Math.round(v*m),0,255);return `rgb(${f(r)},${f(g)},${f(b)})`;}

// ================================================== FIGHTER
class Fighter{
  constructor(x,z,color,name,cpu,tc1,tc2){this.x0=x;this.z0=z;this.color=color;this.name=name;this.cpu=cpu;this.r=30;this.tc1=tc1;this.tc2=tc2;
    this.phase=Math.random()*6.28;this.ai={think:0,mode:'idle',jx:0,chargeT:0,beamT:0};this.reset();}
  reset(){this.x=this.x0;this.y=200;this.z=PLANE_Z;this.vx=0;this.vy=0;this.vz=0;
    this.hp=CFG.hp;this.ki=CFG.ki*.4;this.meleeCd=0;this.blastCd=0;this.hitstun=0;this.charging=false;this.blocking=false;
    this.flash=0;this.aura=0;this.punchAnim=0;this.chargeTime=0;this.tier=0;this.overcharge=0;
    this.form=0;this.formTimer=0;this.transformCd=0;this.faceScreen=this.cpu?-1:1;
    this.beamState='none';this.beamCharge=0;this.beamTime=0;this.beamPow=0;this.beamCd=0;this._beam=null;}
  get alive(){return this.hp>0;}
  auraColor(){return this.form===2?this.tc2:this.form===1?this.tc1:(this.overcharge>2?'#ffe07a':this.color);}
  atkMul(){return (1+this.tier*CFG.tierMul+(this.overcharge>2?CFG.surgeMul:0))*FORMS[this.form].mul;}
  strength(){return (0.6+this.beamPow)*this.atkMul();}
  hurt(dmg,k,blocked){const m=blocked?CFG.blockMul:1;this.hp=Math.max(0,this.hp-dmg*m);
    this.vx+=k[0]*(blocked?.3:1);this.vy+=k[1]*(blocked?.3:1);this.vz+=k[2]*(blocked?.3:1);
    this.hitstun=blocked?.08:CFG.hitstun;this.flash=.12;
    addSparks(this.x,this.y,this.z,blocked?5:11,blocked?'#bcd0ff':'#ffd27a',blocked?120:240);shake=Math.max(shake,blocked?4:9);SFX.hit();}
  dirTo(o){return norm([o.x-this.x,o.y-this.y,o.z-this.z]);}
  dist(o){return Math.hypot(o.x-this.x,o.y-this.y,o.z-this.z);}
  doMelee(o){if(this.meleeCd>0||this.hitstun>0)return;this.meleeCd=CFG.meleeCd;this.punchAnim=.2;SFX.punch();
    if(this.dist(o)<CFG.meleeRange){const d=this.dirTo(o),K=CFG.meleeKnock;o.hurt(CFG.meleeDmg*this.atkMul(),[d[0]*K,d[1]*K+90,d[2]*K],o.blocking);}}
  doBlast(o){if(this.blastCd>0||this.hitstun>0||this.ki<CFG.blastCost)return;this.blastCd=CFG.blastCd;this.ki-=CFG.blastCost;
    const su=this.overcharge>2||this.form>0,d=this.dirTo(o),m=this.atkMul();
    projectiles.push({x:this.x+d[0]*(this.r+8),y:this.y+d[1]*(this.r+8),z:this.z+d[2]*(this.r+8),
      vx:d[0]*CFG.blastSpd,vy:d[1]*CFG.blastSpd,vz:d[2]*CFG.blastSpd,r:CFG.blastR*(su?1.5:1),owner:this,life:1.8,
      c:su?this.auraColor():this.color,dmg:CFG.blastDmg*m,carveR:48*(su?1.6:1)});
    if(this.overcharge>2)this.overcharge=Math.max(0,this.overcharge-26);SFX.blast();}
  fireBeam(o){this.beamState='firing';this.beamPow=this.beamCharge;this.beamTime=CFG.beamDur*(.7+this.beamCharge*1.1);
    this.ki=Math.max(0,this.ki-CFG.beamCost*(.4+this.beamCharge*.6));this.beamCd=.6;SFX.beam();shake=Math.max(shake,8);}
  transform(){if(this.form>=2||this.transformCd>0)return;this.form++;this.overcharge=0;this.formTimer=9-this.form*1.5;
    this.transformCd=.6;this.ki=CFG.ki;carve(this.x,this.z,this.r*3,26);shake=14;flashScreen=.85;
    addSparks(this.x,this.y,this.z,26,this.auraColor(),320);SFX.trans();}

  control(inp,o,dt){this.charging=false;this.blocking=false;
    const wb=inp.beam&&this.hitstun<=0&&this.beamCd<=0;
    if(this.beamState==='firing'){}
    else if(wb&&(this.beamState==='charging'||this.ki>=CFG.beamMinCost)){this.beamState='charging';
      this.beamCharge=Math.min(1,this.beamCharge+CFG.beamChargeRate*dt);this.ki=Math.max(0,this.ki-6*dt);}
    else{if(this.beamState==='charging'){if(this.beamCharge>=.25)this.fireBeam(o);else{this.beamState='none';this.beamCharge=0;}}
      this.charging=inp.charge&&this.hitstun<=0;this.blocking=inp.block&&!this.charging&&this.hitstun<=0;}
    const sm=FORMS[this.form].spd,slow=this.beamState!=='none'?.14:this.charging?.18:this.blocking?.4:1;
    this.vx+=inp.mx*slow*CFG.accel*sm*dt;this.vy+=inp.mz*slow*CFG.accel*sm*dt;
    if(this.beamState==='none'){if(inp.punchQ)this.doMelee(o);if(inp.blastQ)this.doBlast(o);}
    if(inp.transformQ&&this.overcharge>=60)this.transform();}

  aiThink(o,dt){const ai=this.ai,inp={mx:0,mz:0,charge:false,block:false,beam:false,punchQ:false,blastQ:false,transformQ:false};
    const dx=o.x-this.x,dy=o.y-this.y,dist=this.dist(o),tX=Math.sign(dx)||1,tY=Math.sign(dy)||1;
    if(this.overcharge>=100&&this.form<2&&Math.random()<.5)inp.transformQ=true;

    if(ai.beamT>0){ai.beamT-=dt;inp.beam=true;inp.mz=Math.abs(dy)>40?tY*0.6:0;if(dist<220)inp.mx=-tX*.5;return inp;}
    for(const p of projectiles){if(p.owner===this)continue;
      if(Math.hypot(p.x-this.x,p.y-this.y)<260&&this.dist(p)<300){inp.mz=(this.y-p.y)>0?1:-1;if(dist<280)inp.block=true;}}
    if(ai.think<=0){ai.think=.28+Math.random()*.4;ai.jx=(Math.random()*2-1)*.7;const r=Math.random();
      if(this.ki<CFG.blastCost&&dist>260)ai.mode='charge';

      else if(dist>240&&r<.3&&this.ki>CFG.beamMinCost+12){ai.beamT=.6+Math.random()*.5;ai.mode='idle';}

    switch(ai.mode){
      case 'charge':inp.charge=this.ki<CFG.ki*.9;inp.mz=0.2;if(dist<190){inp.mx=-tX;inp.charge=false;}break;
      case 'approach':inp.mx=tX;inp.mz=Math.abs(dy)>30?tY:0.2;break;
      case 'blast':inp.mx=dist<280?-tX*.5:ai.jx;inp.mz=Math.abs(dy)>26?tY:0.15;if(this.blastCd<=0&&Math.random()<.5)inp.blastQ=true;break;

  update(dt,inp,o){this.meleeCd=Math.max(0,this.meleeCd-dt);this.blastCd=Math.max(0,this.blastCd-dt);this.beamCd=Math.max(0,this.beamCd-dt);
    this.transformCd=Math.max(0,this.transformCd-dt);this.hitstun=Math.max(0,this.hitstun-dt);this.flash=Math.max(0,this.flash-dt);this.punchAnim=Math.max(0,this.punchAnim-dt);
    if(this.beamState==='firing'){this.beamTime-=dt;if(this.beamTime<=0){this.beamState='none';this.beamCharge=0;}}
    if(this.hitstun>0)inp={mx:0,mz:0,charge:false,block:false,beam:false,punchQ:false,blastQ:false,transformQ:false};
    this.control(inp,o,dt);
    if(this.charging){this.chargeTime+=dt;this.tier=this.chargeTime>2.8?3:this.chargeTime>1.4?2:this.chargeTime>.5?1:0;
      this.ki+=CFG.chargeRate*dt;if(this.ki>=CFG.ki){this.ki=CFG.ki;this.overcharge=Math.min(100,this.overcharge+CFG.ocRate*dt);}
      this.aura=Math.min(1,this.aura+dt*4);
      if(Math.random()<.4)addSparks(this.x,this.y-8,this.z,1,this.auraColor(),80);if(Math.random()<.05)SFX.charge();
      if(this.tier>=2){const dd=this.dirTo(o),D=this.dist(o);if(D<190){o.vx-=dd[0]*220*dt;o.vy-=dd[1]*220*dt;o.vz-=dd[2]*220*dt;}}
      if(this.tier>=3)shake=Math.max(shake,3);
    }else{this.chargeTime=0;this.tier=0;this.ki=Math.min(CFG.ki,this.ki+CFG.regen*dt);
      this.overcharge=Math.max(0,this.overcharge-CFG.ocDecay*dt);this.aura=Math.max(0,this.aura-dt*3);}
    if(this.form>0){this.formTimer-=dt;this.ki=Math.max(0,this.ki-FORMS[this.form].drain*dt);
      if(this.formTimer<=0||this.ki<=0){this.form=0;addSparks(this.x,this.y,this.z,10,'#ffffff',160);}}
    // two-axis flight: X (left/right) + Y (altitude), depth Z locked to the plane
    const dr=Math.exp(-CFG.drag*dt);this.vx*=dr;this.vy*=dr;
    this.vy-=CFG.grav*dt;
    const hs=Math.hypot(this.vx,this.vy),mx=CFG.maxSpd*FORMS[this.form].spd;if(hs>mx){this.vx*=mx/hs;this.vy*=mx/hs;}
    this.vz=0;this.z=PLANE_Z;
    const gy=heightAt(this.x,PLANE_Z);
    this.x+=this.vx*dt;this.y+=this.vy*dt;
    if(this.x<AX0+this.r){this.x=AX0+this.r;this.vx*=-.4;}if(this.x>AX1-this.r){this.x=AX1-this.r;this.vx*=-.4;}
    if(this.y>YMAX){this.y=YMAX;this.vy*=-.3;}
    if(this.y<gy+this.r){const imp=-this.vy;this.y=gy+this.r;
      if(imp>CFG.slamSpd){carve(this.x,PLANE_Z,this.r*1.9,24);this.hp=Math.max(0,this.hp-(imp-CFG.slamSpd)*CFG.slamK);this.vy=imp*.42;SFX.boom();shake=Math.max(shake,7);}
      else this.vy=Math.abs(this.vy)*.3;this.vx*=.85;}
    const me=project(this.x,this.y,this.z),op=project(o.x,o.y,o.z);if(me&&op)this.faceScreen=op.sx>=me.sx?1:-1;}

  pushScene(scene){const p=project(this.x,this.y,this.z);if(!p)return;
    const gy=heightAt(this.x,this.z),sp=project(this.x,gy+1,this.z);

  drawFig(p){const cx=p.sx,cy=p.sy,u=this.r*p.sc*0.60,f=this.faceScreen;

      const rad=u*(3.2+.4*this.tier+(this.form?.7:0)),g=ctx.createRadialGradient(cx,cy,u,cx,cy,rad);

    else if(pose==='beam'){hF=[cx+f*1.75*u,cy-.45*u];hB=[cx+f*1.2*u,cy-.15*u];ftF=[cx-f*.2*u,cy+2.0*u];ftB=[cx-f*.8*u,cy+1.66*u];}

}

// ================================================== BEAMS
function resolveBeams(dt){for(const f of [P1,P2]){if(f.beamState!=='firing'){f._beam=null;continue;}
  const o=f===P1?P2:P1,d=f.dirTo(o),m=[f.x+d[0]*(f.r+8),f.y+d[1]*(f.r+8),f.z+d[2]*(f.r+8)],th=CFG.beamThick*(.7+f.beamPow*.9);
  let L=CFG.beamRange,clash=false;
  if(o.beamState==='firing'){const od=o.dirTo(f);if(dot(d,od)<-.3){const fs=f.strength(),os=o.strength();L=f.dist(o)*(fs/(fs+os));clash=true;}}
  const end=[m[0]+d[0]*L,m[1]+d[1]*L,m[2]+d[2]*L];f._beam={m,end,th,c:f.auraColor()};
  for(let t=0;t<L;t+=28){const px=m[0]+d[0]*t,py=m[1]+d[1]*t,pz=m[2]+d[2]*t;if(py<=heightAt(px,pz)+th)carve(px,pz,th*1.5,th);}
  if(clash){const cp=end;if(Math.random()<.9)addSparks(cp[0],cp[1],cp[2],4,'#fff',240);addSparks(cp[0],cp[1],cp[2],2,f.c,180);shake=Math.max(shake,6);
    const fs=f.strength(),os=o.strength();if(fs>os*1.25)o.hp=Math.max(0,o.hp-CFG.beamDps*.3*dt);}
  else{const rel=sub([o.x,o.y,o.z],m);let t=clamp(dot(rel,d),0,L);const cp=[m[0]+d[0]*t,m[1]+d[1]*t,m[2]+d[2]*t];
    if(Math.hypot(o.x-cp[0],o.y-cp[1],o.z-cp[2])<th+o.r){const dmg=CFG.beamDps*(.6+f.beamPow)*f.atkMul()*dt;o.hp=Math.max(0,o.hp-dmg*(o.blocking?CFG.blockMul:1));
      o.vx+=d[0]*CFG.beamKnock*dt;o.vy+=d[1]*CFG.beamKnock*dt+20*dt;o.vz+=d[2]*CFG.beamKnock*dt;o.hitstun=Math.max(o.hitstun,.05);o.flash=.08;
      if(Math.random()<.6)addSparks(o.x,o.y,o.z,3,f.c,200);shake=Math.max(shake,5);}}
  f.vx-=d[0]*80*dt;f.vz-=d[2]*80*dt;}}

// ================================================== GAME
let P1,P2,state='title',perf=0,winner=null,koTimer=0,introT=0;
function mk(){P1=new Fighter(-220,560,'#3f7bff','YOU',false,'#ffd23a','#8ff6ff');P2=new Fighter(220,900,'#ff4d5e','RIVAL',true,'#ff9a3a','#ff9ff0');}
function newMatch(){buildTerrain();if(!P1)mk();else{P1.reset();P2.reset();}projectiles=[];sparks=[];winner=null;koTimer=0;introT=1.1;state='playing';}
buildTerrain();mk();

function stepProjectiles(dt){for(const p of projectiles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
  if(p.x<AX0||p.x>AX1||p.z<AZ0||p.z>AZ1){p.life=0;addSparks(p.x,p.y,p.z,6,p.c,160);continue;}
  if(p.y<heightAt(p.x,p.z)){p.life=0;carve(p.x,p.z,p.carveR,22);addSparks(p.x,p.y,p.z,10,p.c,200);SFX.boom();continue;}
  const t=p.owner===P1?P2:P1;if(Math.hypot(t.x-p.x,t.y-p.y,t.z-p.z)<t.r+p.r){
    t.hurt(p.dmg,[p.vx/CFG.blastSpd*CFG.blastKnock,40,p.vz/CFG.blastSpd*CFG.blastKnock],t.blocking);p.life=0;addSparks(p.x,p.y,p.z,12,p.c,240);}}
  projectiles=projectiles.filter(p=>p.life>0);}
function stepSparks(dt){for(const s of sparks){s.t+=dt;s.vy-=460*dt;s.x+=s.vx*dt;s.y+=s.vy*dt;s.z+=s.vz*dt;}
  sparks=sparks.filter(s=>s.t<s.life);if(sparks.length>560)sparks.splice(0,sparks.length-560);}
function stepScorch(dt){const k=Math.exp(-0.25*dt);for(let i=0;i<scorch.length;i++)if(scorch[i]>0)scorch[i]*=k;}

function update(dt){perf+=dt;if(shake>0)shake=Math.max(0,shake-dt*40);if(flashScreen>0)flashScreen=Math.max(0,flashScreen-dt*2.5);
  if(state==='playing'){if(introT>0)introT-=dt;
    let a;if(introT>0)a={mx:0,mz:0,charge:false,block:false,beam:false,punchQ:false,blastQ:false,transformQ:false};
    else{const km=keyMove();a={mx:clamp(km[0]+tmx,-1,1),mz:clamp(km[1]+tmz,-1,1),charge:input.charge,block:input.block,beam:input.beam,punchQ:input.punchQ,blastQ:input.blastQ,transformQ:input.transformQ};}
    const b=introT>0?{mx:0,mz:0,charge:false,block:false,beam:false,punchQ:false,blastQ:false,transformQ:false}:P2.aiThink(P1,dt);
    P1.update(dt,a,P2);P2.update(dt,b,P1);resolveBeams(dt);stepProjectiles(dt);stepSparks(dt);stepScorch(dt);
    if(!P1.alive||!P2.alive){state='ko';winner=P1.alive?P1:P2;koTimer=0;SFX.ko();shake=14;flashScreen=1;}
  }else stepSparks(dt);
  camUpdate(dt);
  input.punchQ=false;input.blastQ=false;input.transformQ=false;
  if(input.start){input.start=false;if(state==='title')newMatch();else if(state==='ko'&&koTimer>.8)newMatch();}
  if(state==='ko')koTimer+=dt;}

// ================================================== RENDER
function roundRect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function bar(x,y,w,h,frac,c1,c2,flip){ctx.fillStyle='rgba(10,14,26,.7)';roundRect(x,y,w,h,4);ctx.fill();
  const fw=Math.max(0,w-4)*clamp(frac,0,1),gx=flip?x+w-2-fw:x+2,g=ctx.createLinearGradient(gx,0,gx+fw,0);
  g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;roundRect(gx,y+2,fw,h-4,3);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1.5;roundRect(x,y,w,h,4);ctx.stroke();}

const LIGHT=norm([-0.45,1,-0.4]);
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#161233');g.addColorStop(.42,'#38285c');g.addColorStop(.66,'#8a4a6b');g.addColorStop(.82,'#d97e54');g.addColorStop(1,'#f0b070');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<46;i++){ctx.globalAlpha=.2+.5*((i*13)%10)/10;ctx.fillRect((i*97%W),(i*43%190),2,2);}ctx.globalAlpha=1;
  const sg=ctx.createRadialGradient(W*.5,238,10,W*.5,238,190);sg.addColorStop(0,'rgba(255,232,185,.9)');sg.addColorStop(1,'rgba(255,180,120,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(W*.5,244,190,0,7);ctx.fill();
  // distant ridge silhouettes (parallax)
  ctx.fillStyle='rgba(40,28,54,.55)';ctx.beginPath();ctx.moveTo(0,H*.62);
  for(let x=0;x<=W;x+=40)ctx.lineTo(x,H*.62-28-24*Math.sin(x*.017+1)-16*Math.cos(x*.006));ctx.lineTo(W,H*.72);ctx.lineTo(0,H*.72);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(28,20,42,.5)';ctx.beginPath();ctx.moveTo(0,H*.68);
  for(let x=0;x<=W;x+=32)ctx.lineTo(x,H*.68-18-16*Math.sin(x*.026+3));ctx.lineTo(W,H*.78);ctx.lineTo(0,H*.78);ctx.closePath();ctx.fill();}

function pushTerrain(scene){for(let j=0;j<GZ;j++)for(let i=0;i<GX;i++){
  const x0=gX(i),x1=gX(i+1),z0=gZ(j),z1=gZ(j+1),h00=hmap[gi(i,j)],h10=hmap[gi(i+1,j)],h11=hmap[gi(i+1,j+1)],h01=hmap[gi(i,j+1)];
  const p00=project(x0,h00,z0),p10=project(x1,h10,z0),p11=project(x1,h11,z1),p01=project(x0,h01,z1);
  if(!p00||!p10||!p11||!p01)continue;
  const mnx=Math.min(p00.sx,p10.sx,p11.sx,p01.sx),mxx=Math.max(p00.sx,p10.sx,p11.sx,p01.sx),mny=Math.min(p00.sy,p10.sy,p11.sy,p01.sy),mxy=Math.max(p00.sy,p10.sy,p11.sy,p01.sy);
  if(mxx<0||mnx>W||mxy<0||mny>H)continue;
  let n=cross([x1-x0,h10-h00,0],[0,h01-h00,z1-z0]);if(n[1]<0)n=[-n[0],-n[1],-n[2]];n=norm(n);
  const br=clamp(dot(n,LIGHT),.54,1.2),slope=1-clamp(n[1],0,1),avgH=(h00+h10+h11+h01)/4,depth=(p00.vz+p10.vz+p11.vz+p01.vz)/4;
  const sc=(scorch[gi(i,j)]+scorch[gi(i+1,j)]+scorch[gi(i,j+1)]+scorch[gi(i+1,j+1)])/4;
  let base=avgH<2?'#6f5638':avgH<26?'#9c7048':avgH<62?'#86974f':avgH<116?'#ac9d6e':'#cbc6ab';
  if(slope>.52)base=mix(base,'#9a9082',clamp((slope-.52)*1.7,0,.72));
  const hh=((i*73856093)^(j*19349663))>>>0,nt=((hh%128)/128-.5)*.14;
  let col=lit(base,0.66+br*0.6+nt);
  if(sc>.03)col=mix(col,'#341a0d',clamp(sc*.82,0,.76));
  const fog=clamp((depth-680)/2000,0,.44);col=mix(col,'#9a5a72',fog);
  scene.push({depth,f:()=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(p00.sx,p00.sy);ctx.lineTo(p10.sx,p10.sy);ctx.lineTo(p11.sx,p11.sy);ctx.lineTo(p01.sx,p01.sy);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.08)';ctx.lineWidth=1;ctx.stroke();}});}}

function pushBeam(scene,f){if(!f._beam)return;const b=f._beam,pm=project(b.m[0],b.m[1],b.m[2]),pe=project(b.end[0],b.end[1],b.end[2]);
  if(!pm||!pe)return;const depth=Math.min(pm.vz,pe.vz)-2,w=b.th*Math.max(pm.sc,pe.sc);
  scene.push({depth,f:()=>{ctx.lineCap='round';ctx.strokeStyle=ha(b.c,.85);ctx.lineWidth=w*2;ctx.beginPath();ctx.moveTo(pm.sx,pm.sy);ctx.lineTo(pe.sx,pe.sy);ctx.stroke();
    ctx.strokeStyle=ha('#ffffff',.9);ctx.lineWidth=w*.8;ctx.stroke();
    for(const q of [[pm,w*1.6],[pe,w*2.1]]){const g=ctx.createRadialGradient(q[0].sx,q[0].sy,1,q[0].sx,q[0].sy,q[1]);g.addColorStop(0,'#fff');g.addColorStop(.5,ha(b.c,.8));g.addColorStop(1,ha(b.c,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(q[0].sx,q[0].sy,q[1],0,7);ctx.fill();}}});}

function pushProjectiles(scene){for(const p of projectiles){const pr=project(p.x,p.y,p.z);if(!pr)continue;const r=p.r*pr.sc;
  scene.push({depth:pr.vz,f:()=>{for(let i=3;i>=1;i--){ctx.fillStyle=ha(p.c,.14*i);ctx.beginPath();ctx.arc(pr.sx-p.vx*.004*i*pr.sc,pr.sy+p.vy*.004*i*pr.sc,r+i*3*pr.sc,0,7);ctx.fill();}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pr.sx,pr.sy,r*.55,0,7);ctx.fill();ctx.globalAlpha=.75;ctx.fillStyle=ha(p.c,.9);ctx.beginPath();ctx.arc(pr.sx,pr.sy,r,0,7);ctx.fill();ctx.globalAlpha=1;}});}}
function pushSparks(scene){for(const s of sparks){const pr=project(s.x,s.y,s.z);if(!pr)continue;const al=Math.max(0,1-s.t/s.life);
  scene.push({depth:pr.vz-.5,f:()=>{ctx.globalAlpha=al;ctx.fillStyle=s.c;ctx.beginPath();ctx.arc(pr.sx,pr.sy,Math.max(.8,s.r*pr.sc),0,7);ctx.fill();ctx.globalAlpha=1;}});}}

function ctr(lines){ctx.textAlign='center';for(const L of lines){ctx.font=L.f;ctx.fillStyle=L.c||'#fff';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;ctx.fillText(L.t,W/2,L.y);ctx.shadowBlur=0;}ctx.textAlign='left';}
function hud(){bar(24,26,300,22,P1.hp/CFG.hp,'#5fe08a','#2fae5a',false);bar(24,52,240,11,P1.ki/CFG.ki,'#5fb0ff','#2f6fe0',false);
  if(P1.overcharge>2)bar(24,65,240,6,P1.overcharge/100,'#ffe07a','#f0a020',false);
  bar(W-324,26,300,22,P2.hp/CFG.hp,'#ff8f6a','#e0432f',true);bar(W-264,52,240,11,P2.ki/CFG.ki,'#c08fff','#7a3fe0',true);
  if(P2.overcharge>2)bar(W-264,65,240,6,P2.overcharge/100,'#ffe07a','#f0a020',true);
  ctx.font='700 15px ui-monospace,monospace';ctx.textBaseline='alphabetic';ctx.fillStyle='#eaf0ff';ctx.textAlign='left';ctx.fillText(P1.name,24,20);
  ctx.textAlign='right';ctx.fillText(P2.name,W-24,20);ctx.textAlign='left';
  for(const[f,sd] of [[P1,'L'],[P2,'R']]){let lbl='',cl='#9fd0ff';
    if(f.form>0){lbl=FORMS[f.form].n;cl=f.auraColor();}else if(f.overcharge>=100){lbl='TRANSFORM! (T)';cl='#ffe07a';}else if(f.overcharge>2){lbl='SURGE';cl='#ffe07a';}else if(f.tier>0){lbl='CHARGE '+f.tier;}
    if(lbl){ctx.textAlign=sd==='L'?'left':'right';ctx.font='700 12px ui-monospace,monospace';ctx.fillStyle=cl;ctx.fillText(lbl,sd==='L'?24:W-24,88);ctx.textAlign='left';}}}

function render(){buildCam();const v=vp();ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save();ctx.translate(v.ox,v.oy);ctx.scale(v.s,v.s);ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
  const sx=shake?(Math.random()*2-1)*shake:0,sy=shake?(Math.random()*2-1)*shake:0;ctx.translate(sx,sy);
  drawSky();
  const scene=[];pushTerrain(scene);P2.pushScene(scene);P1.pushScene(scene);pushBeam(scene,P2);pushBeam(scene,P1);pushProjectiles(scene);pushSparks(scene);
  scene.sort((a,b)=>b.depth-a.depth);for(const it of scene)it.f();
  if(flashScreen>0){ctx.fillStyle=ha('#ffffff',flashScreen*.4);ctx.fillRect(0,0,W,H);}
  hud();
  if(state==='playing'&&introT>0)ctr([{t:'ROUND START',f:'700 46px ui-monospace,monospace',c:'#ffe07a',y:H/2}]);
  if(state==='title'){ctx.fillStyle='rgba(6,8,16,.5)';ctx.fillRect(0,0,W,H);ctr([
    {t:'KI BLOBS 3D',f:'800 70px ui-monospace,monospace',c:'#ffe27a',y:168},
    {t:'AERIAL BRAWL',f:'700 26px ui-monospace,monospace',c:'#7ad0ff',y:208},
    {t:'Fly a huge 3D arena · Charge · Transform · Beams',f:'500 17px ui-monospace,monospace',c:'#c7d0ee',y:278},
    {t:'Destructible textured terrain · momentum slams',f:'500 15px ui-monospace,monospace',c:'#8fa0c8',y:304},
    {t:'PRESS SPACE / TAP A BUTTON TO FIGHT',f:'700 20px ui-monospace,monospace',c:'#fff',y:372}]);}
  if(state==='ko'){ctx.fillStyle='rgba(6,8,16,.5)';ctx.fillRect(0,0,W,H);const win=winner===P1;ctr([
    {t:win?'K.O. — YOU WIN!':'K.O. — YOU LOSE',f:'800 56px ui-monospace,monospace',c:win?'#5fe08a':'#ff6a7a',y:H/2-10},
    {t:koTimer>.8?'PRESS SPACE / TAP TO REMATCH':'...',f:'700 20px ui-monospace,monospace',c:'#fff',y:H/2+40}]);}
  ctx.restore();}

// ================================================== LOOP
let last=performance.now();
function frame(now){let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
})();
</script>
