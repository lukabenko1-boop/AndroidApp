<title>KI BLOBS — Aerial Brawl</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
  :root{ --ink:#EAF0FF; --dim:#8A93B2; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; background:#0b0e1a; overflow:hidden;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; color:var(--ink);
    touch-action:none; user-select:none; -webkit-user-select:none;}
  #stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center;}
  #wrap{position:relative; width:100%; height:100%;}
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block;}

  /* ---- touch controls ---- */
  #pad{position:absolute; inset:0; pointer-events:none;}
  .ctl{position:absolute; pointer-events:auto;}
  #stick{left:3.5%; bottom:6%; width:34vmin; height:34vmin; max-width:190px; max-height:190px;
    border-radius:50%; background:rgba(140,160,220,.08); border:2px solid rgba(160,180,240,.22); touch-action:none;}
  #nub{position:absolute; left:50%; top:50%; width:42%; height:42%; transform:translate(-50%,-50%);
    border-radius:50%; background:radial-gradient(circle at 35% 30%,#9fb4ff,#4a5cc0);
    border:2px solid rgba(255,255,255,.35); box-shadow:0 4px 14px rgba(0,0,0,.4);}
  #btns{right:3%; bottom:5%; width:46vmin; height:46vmin; max-width:260px; max-height:260px;}
  .btn{position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:min(3.1vmin,15px); letter-spacing:.02em; color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.5); touch-action:none;
    border:2px solid rgba(255,255,255,.25); box-shadow:0 4px 12px rgba(0,0,0,.35);}
  .btn:active,.btn.on{filter:brightness(1.35);}
  #bPunch{width:42%; height:42%; right:52%; top:1%;  background:radial-gradient(circle at 35% 30%,#ff8a7a,#c9372a);}
  #bBlast{width:42%; height:42%; right:1%;  top:52%; transform:translateY(-50%); background:radial-gradient(circle at 35% 30%,#7ad0ff,#2570c9);}
  #bCharge{width:42%; height:42%; right:52%; bottom:1%; background:radial-gradient(circle at 35% 30%,#ffe07a,#d09a1a);}
  #bBlock{width:42%; height:42%; left:1%;  top:52%; transform:translateY(-50%); background:radial-gradient(circle at 35% 30%,#b9a6ff,#6a4fd0);}
  #bBeam{width:34%; height:34%; left:50%; top:50%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 35% 30%,#fff2b0,#e08a2a); font-size:min(2.6vmin,13px);}
  #bBlast:active,#bBlast.on,#bBlock:active,#bBlock.on{transform:translateY(-50%) scale(.95);}
  #bBeam:active,#bBeam.on{transform:translate(-50%,-50%) scale(.94);}

  #hint{position:absolute; left:50%; bottom:1.5%; transform:translateX(-50%); font-size:11px;
    color:var(--dim); text-align:center; pointer-events:none; width:94%;}
  @media (pointer:coarse){ #hint{display:none;} }
  @media (pointer:fine){ #pad{opacity:.30;} }
</style>

<div id="stage"><div id="wrap">
  <canvas id="cv"></canvas>
  <div id="pad">
    <div id="stick" class="ctl"><div id="nub"></div></div>
    <div id="btns" class="ctl">
      <div class="btn" id="bPunch">PUNCH</div>
      <div class="btn" id="bBlast">BLAST</div>
      <div class="btn" id="bCharge">CHARGE</div>
      <div class="btn" id="bBlock">BLOCK</div>
      <div class="btn" id="bBeam">BEAM</div>
    </div>
  </div>
  <div id="hint">MOVE WASD/Arrows · <b>J</b> Punch · <b>K</b> Blast · <b>L</b> Charge(hold) · <b>I</b> Beam(hold→release) · <b>Shift</b> Block · <b>Space</b> Start</div>
</div></div>

<script>
"use strict";
(function(){
// ============================================================= CONFIG
const W=960, H=540, ROOF=54, WALL=40;
const NCOL=160, COLW=W/NCOL;
const CFG={
  accel:1950, maxSpd:390, friction:4.4, grav:150,
  hp:100, ki:100, blastCost:20, chargeRate:44, regen:6, ocRate:38, ocDecay:7,
  meleeDmg:9, blastDmg:11, blockMul:0.26,
  meleeCd:0.32, blastCd:0.40, meleeRange:84, hitstun:0.22,
  meleeKnock:400, blastKnock:330, blastSpd:660, blastR:12,
  slamSpeed:250, slamDmgK:0.05,
  beamMinCost:24, beamCost:40, beamDps:56, beamDur:0.5, beamThick:15, beamChargeRate:0.85, beamKnock:280,
  tierMul:0.12, surgeMul:0.35,
};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ============================================================= CANVAS
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function resize(){ const r=document.getElementById('wrap').getBoundingClientRect();
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); }
window.addEventListener('resize',resize); resize();
function view(){ const s=Math.min(cv.width/W,cv.height/H); return {s,ox:(cv.width-W*s)/2,oy:(cv.height-H*s)/2}; }

// ============================================================= AUDIO
let AC=null;
function audioInit(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); }
function beep(type,f0,f1,dur,vol,when){ if(!AC)return; const t=AC.currentTime+(when||0);
  const o=AC.createOscillator(),g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+0.02); }
function noise(dur,vol,freq){ if(!AC)return; const t=AC.currentTime; const n=Math.floor(AC.sampleRate*dur);
  const buf=AC.createBuffer(1,n,AC.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=buf; const g=AC.createGain(); g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur); const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq||900;
  s.connect(f); f.connect(g); g.connect(AC.destination); s.start(t); }
const SFX={ punch:()=>beep('square',220,90,0.09,0.18), blast:()=>beep('sawtooth',680,180,0.22,0.15),
  hit:()=>{noise(0.12,0.25,800); beep('square',160,60,0.1,0.12);}, charge:()=>beep('sine',140,320,0.14,0.05),
  beam:()=>{beep('sawtooth',300,900,0.5,0.14); noise(0.5,0.08,1400);}, boom:()=>{noise(0.3,0.3,300); beep('sine',120,40,0.3,0.16);},
  ko:()=>{beep('sawtooth',400,60,0.6,0.2); noise(0.5,0.2,500);} };

// ============================================================= INPUT
const input={mx:0,my:0,charge:false,block:false,beam:false,punchQ:false,blastQ:false,start:false};
const keys={};
const KMOVE={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
window.addEventListener('keydown',e=>{ const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(k in KMOVE||k===' '||k==='Shift'||['j','k','l','i'].includes(k)) e.preventDefault();
  if(keys[k])return; keys[k]=true; audioInit();
  if(k==='j')input.punchQ=true; if(k==='k')input.blastQ=true;
  if(k==='l')input.charge=true; if(k==='i')input.beam=true;
  if(k==='Shift')input.block=true; if(k===' ')input.start=true;
},{passive:false});
window.addEventListener('keyup',e=>{ const k=e.key.length===1?e.key.toLowerCase():e.key; keys[k]=false;
  if(k==='l')input.charge=false; if(k==='i')input.beam=false; if(k==='Shift')input.block=false; });
function keyMove(){ let x=0,y=0; for(const k in KMOVE){ if(keys[k]){x+=KMOVE[k][0]; y+=KMOVE[k][1];} }
  const m=Math.hypot(x,y); if(m>1){x/=m;y/=m;} return [x,y]; }

const stick=document.getElementById('stick'), nub=document.getElementById('nub');
let stickId=null, tmx=0, tmy=0;
function stickMove(e){ const r=stick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  let px,py; if(e.touches){ let f=null; for(const tt of e.touches){ if(tt.identifier===stickId){f=tt;break;} } if(!f)return; px=f.clientX;py=f.clientY; } else {px=e.clientX;py=e.clientY;}
  let dx=px-cx, dy=py-cy; const max=r.width*0.42, d=Math.hypot(dx,dy); if(d>max){dx=dx/d*max;dy=dy/d*max;}
  nub.style.left=(50+dx/r.width*100)+'%'; nub.style.top=(50+dy/r.height*100)+'%'; tmx=dx/max; tmy=dy/max; }
function stickEnd(){ stickId=null; tmx=0; tmy=0; nub.style.left='50%'; nub.style.top='50%'; }
stick.addEventListener('pointerdown',e=>{audioInit(); stickId=e.pointerId; stick.setPointerCapture(e.pointerId); stickMove(e);});
stick.addEventListener('pointermove',e=>{ if(e.pointerId===stickId) stickMove(e); });
stick.addEventListener('pointerup',stickEnd); stick.addEventListener('pointercancel',stickEnd);
function holdBtn(id,on,off){ const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault(); audioInit(); el.classList.add('on'); on(); el.setPointerCapture(e.pointerId);},{passive:false});
  const up=()=>{ el.classList.remove('on'); off&&off(); };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('pointerleave',up); }
holdBtn('bPunch',()=>{input.punchQ=true; input.start=true;});
holdBtn('bBlast',()=>{input.blastQ=true; input.start=true;});
holdBtn('bCharge',()=>{input.charge=true; input.start=true;}, ()=>{input.charge=false;});
holdBtn('bBlock',()=>{input.block=true; input.start=true;}, ()=>{input.block=false;});
holdBtn('bBeam',()=>{input.beam=true; input.start=true;}, ()=>{input.beam=false;});

// ============================================================= TERRAIN (destructible heightmap)
let terrain=new Float32Array(NCOL+1);
const PEAKS=[[120,120,72],[300,80,58],[470,165,82],[640,95,66],[820,135,74]];
function buildTerrain(){ for(let i=0;i<=NCOL;i++){ const x=i*COLW; let y=506;
  for(const[px,ph,pw] of PEAKS) y-=ph*Math.exp(-((x-px)*(x-px))/(2*pw*pw)); terrain[i]=y; } }
function terrainAt(x){ const t=clamp(x/COLW,0,NCOL), i=Math.floor(t), f=t-i;
  const a=terrain[i], b=terrain[Math.min(NCOL,i+1)]; return a+(b-a)*f; }
function carve(cx,cy,radius){ const i0=Math.max(0,Math.floor((cx-radius)/COLW)), i1=Math.min(NCOL,Math.ceil((cx+radius)/COLW));
  let any=false;
  for(let i=i0;i<=i1;i++){ const dx=i*COLW-cx, rr=radius*radius-dx*dx; if(rr<=0)continue;
    const d=Math.sqrt(rr), top=cy-d, bot=cy+d;
    if(bot>terrain[i] && top<terrain[i]){ const ns=Math.min(H-6,bot); if(ns>terrain[i]){ terrain[i]=ns; any=true; } } }
  if(any) spawnDirt(cx,cy,radius); }
function carveColumn(x,botY){ const i=Math.round(x/COLW); if(i<0||i>NCOL)return;
  if(terrain[i]<botY){ terrain[i]=Math.min(H-6,botY); if(Math.random()<0.12) spawnDirt(x,botY,10); } }

// ============================================================= PARTICLES
let projectiles=[], sparks=[], shake=0, flashScreen=0;
function spawnDirt(x,y,r){ const n=Math.min(9,3+(r/7|0));
  for(let i=0;i<n;i++){ const a=-Math.PI/2+(Math.random()-0.5)*2.2, s=70+Math.random()*170;
    sparks.push({x:x+(Math.random()-0.5)*r,y:y-4,vx:Math.cos(a)*s,vy:Math.sin(a)*s-110,life:0.6+Math.random()*0.5,t:0,c:Math.random()<0.5?'#6b4a34':'#805a40',r:2+Math.random()*3}); } }
function addSparks(x,y,n,color,spd){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, s=spd*(0.4+Math.random());
  sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-40,life:0.35+Math.random()*0.3,t:0,c:color,r:2+Math.random()*2}); } }

// ============================================================= COLOR
function hexRgb(h){ h=h.replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(h,a){ const[r,g,b]=hexRgb(h),f=v=>clamp(Math.round(v+a),0,255); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function hexa(h,a){ const[r,g,b]=hexRgb(h); return `rgba(${r},${g},${b},${a})`; }

// ============================================================= FIGHTER
class Fighter{
  constructor(x,color,name,cpu){ this.x0=x; this.color=color; this.name=name; this.cpu=cpu; this.r=30;
    this.ai={think:0,mode:'idle',jy:0,chargeT:0,beamT:0}; this.reset(); }
  reset(){ this.x=this.x0; this.y=280; this.vx=0; this.vy=0; this.facing=this.cpu?-1:1;
    this.hp=CFG.hp; this.ki=CFG.ki*0.4; this.meleeCd=0; this.blastCd=0; this.hitstun=0;
    this.charging=false; this.blocking=false; this.flash=0; this.aura=0; this.punchAnim=0;
    this.chargeTime=0; this.tier=0; this.overcharge=0;
    this.beamState='none'; this.beamCharge=0; this.beamTime=0; this.beamPow=0; this.beamCd=0; this._beam=null; }
  get alive(){ return this.hp>0; }
  atkMul(){ return 1 + this.tier*CFG.tierMul + (this.overcharge>2?CFG.surgeMul:0); }
  strength(){ return (0.6+this.beamPow)*this.atkMul(); }

  hurt(dmg,kx,ky,blocked){ const m=blocked?CFG.blockMul:1; this.hp=Math.max(0,this.hp-dmg*m);
    this.vx+=kx*(blocked?0.3:1); this.vy+=ky*(blocked?0.3:1); this.hitstun=blocked?0.08:CFG.hitstun; this.flash=0.12;
    addSparks(this.x,this.y,blocked?5:11,blocked?'#bcd0ff':'#ffd27a',blocked?120:260); shake=Math.max(shake,blocked?4:9); SFX.hit(); }

  doMelee(opp){ if(this.meleeCd>0||this.hitstun>0)return; this.meleeCd=CFG.meleeCd; this.punchAnim=0.18; SFX.punch();
    if(Math.hypot(opp.x-this.x,opp.y-this.y)<CFG.meleeRange){ const dx=opp.x-this.x,dy=opp.y-this.y,d=Math.hypot(dx,dy)||1;
      const fb=(dx>0&&opp.facing<0)||(dx<0&&opp.facing>0);
      opp.hurt(CFG.meleeDmg*this.atkMul(), dx/d*CFG.meleeKnock, dy/d*CFG.meleeKnock-70, opp.blocking&&fb); } }
  doBlast(){ if(this.blastCd>0||this.hitstun>0||this.ki<CFG.blastCost)return; this.blastCd=CFG.blastCd; this.ki-=CFG.blastCost;
    const surged=this.overcharge>2; const mul=this.atkMul();
    projectiles.push({x:this.x+this.facing*(this.r+8),y:this.y-4,vx:this.facing*CFG.blastSpd,vy:0,
      r:CFG.blastR*(surged?1.5:1),owner:this,life:1.5,t:0,c:surged?'#ffd36a':this.color,
      dmg:CFG.blastDmg*mul, carveR:CFG.blastR*2.6*(surged?1.7:1)});
    if(surged) this.overcharge=Math.max(0,this.overcharge-28); SFX.blast(); }
  fireBeam(){ this.beamState='firing'; this.beamPow=this.beamCharge; this.beamTime=CFG.beamDur*(0.7+this.beamCharge*1.1);
    this.ki=Math.max(0,this.ki-CFG.beamCost*(0.4+this.beamCharge*0.6)); this.beamCd=0.6; SFX.beam(); shake=Math.max(shake,8); }

  control(inp,opp,dt){ this.charging=false; this.blocking=false;
    if(Math.abs(opp.x-this.x)>4) this.facing=opp.x>this.x?1:-1;
    const wantBeam=inp.beam && this.hitstun<=0 && this.beamCd<=0;
    if(this.beamState==='firing'){ /* locked */ }
    else if(wantBeam && (this.beamState==='charging'||this.ki>=CFG.beamMinCost)){
      this.beamState='charging'; this.beamCharge=Math.min(1,this.beamCharge+CFG.beamChargeRate*dt); this.ki=Math.max(0,this.ki-6*dt);
      if(Math.random()<0.5) addSparks(this.x+this.facing*(this.r+10),this.y-2,1,this.color,60);
    } else {
      if(this.beamState==='charging'){ if(this.beamCharge>=0.25) this.fireBeam(); else { this.beamState='none'; this.beamCharge=0; } }
      this.charging=inp.charge && this.hitstun<=0;
      this.blocking=inp.block && !this.charging && this.hitstun<=0;
    }
    let ax=inp.mx, ay=inp.my;
    const slow=this.beamState!=='none'?0.12:this.charging?0.18:this.blocking?0.4:1;
    this.vx+=ax*slow*CFG.accel*dt; this.vy+=ay*slow*CFG.accel*dt;
    if(this.beamState==='none'){ if(inp.punchQ)this.doMelee(opp); if(inp.blastQ)this.doBlast(); } }

  aiThink(opp,dt){ const ai=this.ai; const inp={mx:0,my:0,charge:false,block:false,beam:false,punchQ:false,blastQ:false};
    const dx=opp.x-this.x, dy=opp.y-this.y, dist=Math.hypot(dx,dy), tX=Math.sign(dx)||1, tY=Math.sign(dy)||1;
    if(ai.chargeT>0){ ai.chargeT-=dt; if(dist<120)inp.mx=-tX; else inp.charge=true; return inp; }
    if(ai.beamT>0){ ai.beamT-=dt; inp.beam=true; inp.my=Math.abs(dy)>16?tY*0.6:0; if(dist<160)inp.mx=-tX*0.5; return inp; }
    for(const p of projectiles){ if(p.owner===this)continue;
      if(Math.sign(p.vx)===Math.sign(this.x-p.x)&&Math.abs(p.y-this.y)<46&&Math.abs(p.x-this.x)<300){ inp.my=p.y>this.y?-1:1; if(dist<220)inp.block=true; } }
    if(ai.think<=0){ ai.think=0.28+Math.random()*0.4; ai.jy=(Math.random()*2-1)*0.7; const r=Math.random();
      if(this.ki<CFG.blastCost && dist>200) ai.mode='charge';
      else if(this.overcharge<3 && this.ki>72 && r<0.22 && dist>170){ ai.chargeT=0.7+Math.random()*0.7; ai.mode='idle'; }
      else if(dist>170 && Math.abs(dy)<48 && this.ki>CFG.beamMinCost+12 && r<0.3){ ai.beamT=0.6+Math.random()*0.5; ai.mode='idle'; }
      else if(dist>300) ai.mode=r<0.6?'approach':'blast';
      else if(dist<105) ai.mode=r<0.7?'melee':'reposition';
      else ai.mode=r<0.5?'blast':'approach'; }
    switch(ai.mode){
      case 'charge': inp.charge=this.ki<CFG.ki*0.9; if(dist<150){inp.mx=-tX; inp.charge=false;} break;
      case 'approach': inp.mx=tX; inp.my=Math.abs(dy)>40?tY:ai.jy; break;
      case 'blast': inp.mx=dist<200?-tX*0.6:0; inp.my=Math.abs(dy)>26?tY:0; if(Math.abs(dy)<40&&this.blastCd<=0&&Math.random()<0.5)inp.blastQ=true; break;
      case 'melee': inp.mx=tX; inp.my=tY*0.6; if(dist<CFG.meleeRange&&this.meleeCd<=0)inp.punchQ=true; if(Math.random()<0.15)inp.block=true; break;
      case 'reposition': inp.mx=-tX; inp.my=ai.jy; break; }
    return inp; }

  update(dt,inp,opp){
    this.meleeCd=Math.max(0,this.meleeCd-dt); this.blastCd=Math.max(0,this.blastCd-dt); this.beamCd=Math.max(0,this.beamCd-dt);
    this.hitstun=Math.max(0,this.hitstun-dt); this.flash=Math.max(0,this.flash-dt); this.punchAnim=Math.max(0,this.punchAnim-dt);
    if(this.beamState==='firing'){ this.beamTime-=dt; if(this.beamTime<=0){ this.beamState='none'; this.beamCharge=0; } }
    if(this.hitstun>0) inp={mx:0,my:0,charge:false,block:false,beam:false,punchQ:false,blastQ:false};
    this.control(inp,opp,dt);
    // charge mechanics
    if(this.charging){ this.chargeTime+=dt;
      this.tier=this.chargeTime>2.8?3:this.chargeTime>1.4?2:this.chargeTime>0.5?1:0;
      this.ki+=CFG.chargeRate*dt; if(this.ki>=CFG.ki){ this.ki=CFG.ki; this.overcharge=Math.min(100,this.overcharge+CFG.ocRate*dt); }
      this.aura=Math.min(1,this.aura+dt*4);
      if(Math.random()<0.4) addSparks(this.x,this.y+8,1,this.overcharge>2?'#ffe07a':this.color,90);
      if(Math.random()<0.05) SFX.charge();
      if(this.tier>=2){ const d=Math.hypot(opp.x-this.x,opp.y-this.y)||1; if(d<150){ opp.vx+=(opp.x-this.x)/d*240*dt; opp.vy+=(opp.y-this.y)/d*240*dt; }
        if(terrainAt(this.x)-(this.y+this.r)<46 && Math.random()<0.5) carve(this.x,terrainAt(this.x),this.r*1.1); }
      if(this.tier>=3) shake=Math.max(shake,3);
    } else { this.chargeTime=0; this.tier=0; this.ki=Math.min(CFG.ki,this.ki+CFG.regen*dt);
      this.overcharge=Math.max(0,this.overcharge-CFG.ocDecay*dt); this.aura=Math.max(0,this.aura-dt*3); }
    // physics
    this.vy+=CFG.grav*dt;
    const fr=Math.exp(-CFG.friction*dt); this.vx*=fr; this.vy*=fr;
    const sp=Math.hypot(this.vx,this.vy); if(sp>CFG.maxSpd){ this.vx*=CFG.maxSpd/sp; this.vy*=CFG.maxSpd/sp; }
    this.x+=this.vx*dt; this.y+=this.vy*dt;
    // walls
    if(this.x<WALL+this.r){ this.x=WALL+this.r; if(this.vx<-CFG.slamSpeed){ this.slam(-this.vx); } this.vx*=-0.4; }
    if(this.x>W-WALL-this.r){ this.x=W-WALL-this.r; if(this.vx>CFG.slamSpeed){ this.slam(this.vx); } this.vx*=-0.4; }
    if(this.y<ROOF+this.r){ this.y=ROOF+this.r; this.vy*=-0.4; }
    // terrain floor
    const gy=terrainAt(this.x);
    if(this.y>gy-this.r){ const impact=this.vy; this.y=gy-this.r;
      if(impact>CFG.slamSpeed){ carve(this.x,gy+this.r*0.4,this.r*1.7); this.hp=Math.max(0,this.hp-(impact-CFG.slamSpeed)*CFG.slamDmgK);
        this.vy=-impact*0.42; SFX.boom(); shake=Math.max(shake,7); }
      else this.vy*=-0.32;
      this.vx*=0.82; }
  }
  slam(spd){ carve(this.x, this.y+this.r, this.r*1.4); this.hp=Math.max(0,this.hp-(spd-CFG.slamSpeed)*CFG.slamDmgK*0.6);
    addSparks(this.x,this.y,8,'#ffd27a',220); SFX.boom(); shake=Math.max(shake,6); }

  draw(){ const x=this.x,y=this.y,r=this.r,f=this.facing, surged=this.overcharge>2;
    // aura
    if(this.charging||this.aura>0.02||surged){ const col=surged?'#ffe07a':this.color;
      const a=this.charging?(0.35+0.1*this.tier)+0.14*Math.sin(perf*20):(surged?0.34:this.aura*0.4);
      const rad=r*(2.1+0.35*this.tier); const g=ctx.createRadialGradient(x,y,r*0.4,x,y,rad);
      g.addColorStop(0,hexa(col,a)); g.addColorStop(1,hexa(col,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,rad,0,7); ctx.fill();
      if(this.charging){ const rings=2+this.tier; ctx.strokeStyle=hexa(col,0.5); ctx.lineWidth=2;
        for(let i=0;i<rings;i++){ const p=((perf*1.3+i/rings)%1); ctx.globalAlpha=1-p; ctx.beginPath(); ctx.arc(x,y+r-p*r*3,r*(0.4+p),0,7); ctx.stroke(); } ctx.globalAlpha=1;
        if(this.tier>=3){ ctx.strokeStyle=hexa('#ffffff',0.6); ctx.lineWidth=1.5; for(let i=0;i<4;i++){ const an=perf*8+i*1.7;
          ctx.beginPath(); ctx.moveTo(x+Math.cos(an)*r*1.2,y+Math.sin(an)*r*1.2); ctx.lineTo(x+Math.cos(an)*rad,y+Math.sin(an)*rad); ctx.stroke(); } } } }
    // beam charge orb
    if(this.beamState==='charging'){ const ox=x+f*(r+10), oy=y-2, br=6+this.beamCharge*22;
      const g=ctx.createRadialGradient(ox,oy,1,ox,oy,br); g.addColorStop(0,'#fff'); g.addColorStop(0.5,hexa(this.color,0.9)); g.addColorStop(1,hexa(this.color,0));
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(ox,oy,br,0,7); ctx.fill(); }
    // block shield
    if(this.blocking){ ctx.strokeStyle=hexa('#bcd8ff',0.7); ctx.lineWidth=3; ctx.beginPath(); ctx.arc(x,y,r+9,0,7); ctx.stroke();
      ctx.fillStyle=hexa('#bcd8ff',0.10); ctx.fill(); }
    // arm
    const reach=this.punchAnim>0?(r+26):(r+4); ctx.fillStyle=shade(this.color,-18); ctx.beginPath(); ctx.arc(x+f*reach,y+8,9,0,7); ctx.fill();
    // body
    const bg=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.2,x,y,r); bg.addColorStop(0,shade(this.color,45)); bg.addColorStop(1,shade(this.color,-30));
    ctx.fillStyle=this.flash>0?'#fff':bg; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
    ctx.lineWidth=2.5; ctx.strokeStyle=surged?'#ffe07a':shade(this.color,-55); ctx.stroke();
    // hair
    ctx.fillStyle=shade(this.color,-40); ctx.beginPath(); ctx.moveTo(x-6,y-r+2); ctx.lineTo(x-1,y-r-11); ctx.lineTo(x+3,y-r+1);
    ctx.lineTo(x+8,y-r-8); ctx.lineTo(x+11,y-r+3); ctx.closePath(); ctx.fill();
    // eyes
    ctx.fillStyle='#141824'; ctx.beginPath(); ctx.arc(x+f*7-2,y-6,4.6,0,7); ctx.arc(x+f*7+9,y-6,4.6,0,7); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+f*7-1+f,y-7,1.6,0,7); ctx.arc(x+f*7+10+f,y-7,1.6,0,7); ctx.fill();
    ctx.strokeStyle='#141824'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x+f*6,y+7,5,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
  }
}

// ============================================================= BEAMS (resolve after movement)
function resolveBeams(dt){
  for(const f of [P1,P2]){ if(f.beamState!=='firing'){ f._beam=null; continue; }
    const opp=f===P1?P2:P1, dir=f.facing, y=f.y-2, x0=f.x+dir*(f.r+8), thick=CFG.beamThick*(0.7+f.beamPow*0.9);
    let end=dir>0?W-WALL:WALL, clash=false, clashX=0;
    if(opp.beamState==='firing' && opp.facing===-dir && ((dir>0&&opp.x>f.x)||(dir<0&&opp.x<f.x))){
      const fs=f.strength(), os=opp.strength(); clashX=f.x+(opp.x-f.x)*(fs/(fs+os)); clash=true; end=clashX; }
    f._beam={x0,y,dir,end,thick};
    // carve terrain along path
    const a=Math.min(x0,end), b=Math.max(x0,end);
    for(let xx=a;xx<=b;xx+=COLW) carveColumn(xx,y+thick);
    if(clash){ if(Math.random()<0.9) addSparks(clashX,y,4,'#fff',260); addSparks(clashX,y,2,f.color,200); shake=Math.max(shake,6);
      const fs=f.strength(), os=opp.strength(); if(fs>os*1.25) opp.hp=Math.max(0,opp.hp-CFG.beamDps*0.3*dt);
    } else {
      const half=thick+opp.r, inFront=dir>0?(opp.x>x0-6&&opp.x<end+opp.r):(opp.x<x0+6&&opp.x>end-opp.r);
      if(inFront && Math.abs(opp.y-y)<half){ const fb=(dir>0&&opp.facing<0)||(dir<0&&opp.facing>0);
        const dmg=CFG.beamDps*(0.6+f.beamPow)*f.atkMul()*dt; opp.hp=Math.max(0,opp.hp-dmg*(opp.blocking&&fb?CFG.blockMul:1));
        opp.vx+=dir*CFG.beamKnock*dt*(opp.blocking?0.3:1); opp.vy+=Math.sin(perf*30)*30*dt; opp.hitstun=Math.max(opp.hitstun,0.05); opp.flash=0.08;
        if(Math.random()<0.6) addSparks(opp.x-dir*opp.r,opp.y,3,f.color,220); shake=Math.max(shake,5); } }
    f.vx-=dir*90*dt; // recoil
  }
}

// ============================================================= GAME
let P1,P2, state='title', perf=0, winner=null, koTimer=0, introT=0;
function newMatch(){ buildTerrain(); if(!P1){ P1=new Fighter(280,'#3f7bff','YOU',false); P2=new Fighter(W-280,'#ff4d5e','RIVAL',true); }
  else { P1.reset(); P2.reset(); } projectiles=[]; sparks=[]; winner=null; koTimer=0; introT=1.1; state='playing'; }
buildTerrain(); P1=new Fighter(280,'#3f7bff','YOU',false); P2=new Fighter(W-280,'#ff4d5e','RIVAL',true);

function stepProjectiles(dt){ for(const p of projectiles){ p.t+=dt; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.x<WALL||p.x>W-WALL){ p.life=0; addSparks(p.x,p.y,6,p.c,180); continue; }
    if(p.y>terrainAt(p.x)){ p.life=0; carve(p.x,p.y,p.carveR); addSparks(p.x,p.y,10,p.c,220); SFX.boom(); continue; }
    const tgt=p.owner===P1?P2:P1;
    if(Math.hypot(tgt.x-p.x,tgt.y-p.y)<tgt.r+p.r){ const fb=(p.vx>0&&tgt.facing<0)||(p.vx<0&&tgt.facing>0);
      tgt.hurt(p.dmg,Math.sign(p.vx)*CFG.blastKnock,-40,tgt.blocking&&fb); p.life=0; addSparks(p.x,p.y,12,p.c,260); } }
  projectiles=projectiles.filter(p=>p.life>0); }
function stepSparks(dt){ for(const s of sparks){ s.t+=dt; s.vy+=520*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; }
  sparks=sparks.filter(s=>s.t<s.life); if(sparks.length>520) sparks.splice(0,sparks.length-520); }

function update(dt){ perf+=dt; if(shake>0)shake=Math.max(0,shake-dt*40); if(flashScreen>0)flashScreen=Math.max(0,flashScreen-dt*3);
  if(state==='playing'){ if(introT>0)introT-=dt;
    let p1inp; if(introT>0) p1inp={mx:0,my:0,charge:false,block:false,beam:false,punchQ:false,blastQ:false};
    else { const km=keyMove(); p1inp={mx:clamp(km[0]+tmx,-1,1),my:clamp(km[1]+tmy,-1,1),charge:input.charge,block:input.block,beam:input.beam,punchQ:input.punchQ,blastQ:input.blastQ}; }
    const p2inp=introT>0?{mx:0,my:0,charge:false,block:false,beam:false,punchQ:false,blastQ:false}:P2.aiThink(P1,dt);
    P1.update(dt,p1inp,P2); P2.update(dt,p2inp,P1); resolveBeams(dt); stepProjectiles(dt); stepSparks(dt);
    if(!P1.alive||!P2.alive){ state='ko'; winner=P1.alive?P1:P2; koTimer=0; SFX.ko(); shake=14; flashScreen=1; }
  } else stepSparks(dt);
  input.punchQ=false; input.blastQ=false;
  if(input.start){ input.start=false; if(state==='title')newMatch(); else if(state==='ko'&&koTimer>0.8)newMatch(); }
  if(state==='ko')koTimer+=dt;
}

// ============================================================= RENDER
function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawBar(x,y,w,h,frac,c1,c2,flip){ ctx.fillStyle='rgba(10,14,26,.7)'; roundRect(x,y,w,h,4); ctx.fill();
  const fw=Math.max(0,w-4)*clamp(frac,0,1), gx=flip?x+w-2-fw:x+2, g=ctx.createLinearGradient(gx,0,gx+fw,0);
  g.addColorStop(0,c1); g.addColorStop(1,c2); ctx.fillStyle=g; roundRect(gx,y+2,fw,h-4,3); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.18)'; ctx.lineWidth=1.5; roundRect(x,y,w,h,4); ctx.stroke(); }

function drawBG(){ const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#241a3e'); g.addColorStop(0.5,'#3a2b5e');
  g.addColorStop(0.75,'#8a4a6b'); g.addColorStop(1,'#e0915a'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.5)'; for(let i=0;i<40;i++){ ctx.globalAlpha=0.2+0.5*((i*13)%10)/10; ctx.fillRect((i*97%W),(i*57%220),2,2); } ctx.globalAlpha=1;
  const sg=ctx.createRadialGradient(W/2,370,10,W/2,370,150); sg.addColorStop(0,'rgba(255,230,180,.9)'); sg.addColorStop(1,'rgba(255,180,120,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(W/2,375,150,0,7); ctx.fill();
  // faint far mountains (non-destructible parallax)
  ctx.fillStyle='rgba(30,22,48,.6)'; ctx.beginPath(); ctx.moveTo(0,H);
  const far=[[0,420],[180,350],[360,410],[540,340],[720,405],[960,360]]; for(const p of far) ctx.lineTo(p[0],p[1]); ctx.lineTo(W,H); ctx.closePath(); ctx.fill(); }

function drawTerrain(){ ctx.beginPath(); ctx.moveTo(0,H); for(let i=0;i<=NCOL;i++) ctx.lineTo(i*COLW,terrain[i]); ctx.lineTo(W,H); ctx.closePath();
  let minY=H; for(let i=0;i<=NCOL;i++) if(terrain[i]<minY)minY=terrain[i];
  const g=ctx.createLinearGradient(0,minY,0,H); g.addColorStop(0,'#6a4632'); g.addColorStop(0.4,'#523425'); g.addColorStop(1,'#33201a');
  ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='rgba(255,200,150,.35)'; ctx.lineWidth=2.5; ctx.beginPath();
  for(let i=0;i<=NCOL;i++){ const x=i*COLW,y=terrain[i]; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.stroke(); }

function drawBeam(f){ if(!f._beam)return; const b=f._beam, y=b.y, x0=b.x0, x1=b.end, th=b.thick, wob=Math.sin(perf*40)*2;
  const grad=ctx.createLinearGradient(0,y-th,0,y+th); grad.addColorStop(0,hexa(f.color,0)); grad.addColorStop(0.5,hexa(f.color,0.85)); grad.addColorStop(1,hexa(f.color,0));
  ctx.fillStyle=grad; ctx.fillRect(Math.min(x0,x1),y-th+wob,Math.abs(x1-x0),th*2);
  ctx.fillStyle=hexa('#ffffff',0.9); ctx.fillRect(Math.min(x0,x1),y-th*0.35,Math.abs(x1-x0),th*0.7);
  // muzzle + impact flares
  for(const[px,rr] of [[x0,th*1.4],[x1,th*1.8]]){ const gg=ctx.createRadialGradient(px,y,1,px,y,rr);
    gg.addColorStop(0,'#fff'); gg.addColorStop(0.5,hexa(f.color,0.8)); gg.addColorStop(1,hexa(f.color,0));
    ctx.fillStyle=gg; ctx.beginPath(); ctx.arc(px,y,rr,0,7); ctx.fill(); }
  if(Math.random()<0.5) addSparks(x1,y,2,f.color,180); }

function drawCenter(lines){ ctx.textAlign='center'; for(const L of lines){ ctx.font=L.f; ctx.fillStyle=L.c||'#fff';
  ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=8; ctx.fillText(L.t,W/2,L.y); ctx.shadowBlur=0; } ctx.textAlign='left'; }

function drawHUD(){ drawBar(24,26,300,22,P1.hp/CFG.hp,'#5fe08a','#2fae5a',false);
  drawBar(24,52,240,11,P1.ki/CFG.ki,'#5fb0ff','#2f6fe0',false); if(P1.overcharge>2)drawBar(24,65,240,6,P1.overcharge/100,'#ffe07a','#f0a020',false);
  drawBar(W-324,26,300,22,P2.hp/CFG.hp,'#ff8f6a','#e0432f',true);
  drawBar(W-264,52,240,11,P2.ki/CFG.ki,'#c08fff','#7a3fe0',true); if(P2.overcharge>2)drawBar(W-264,65,240,6,P2.overcharge/100,'#ffe07a','#f0a020',true);
  ctx.font='700 15px ui-monospace,monospace'; ctx.textBaseline='alphabetic'; ctx.fillStyle='#eaf0ff'; ctx.textAlign='left'; ctx.fillText(P1.name,24,20);
  ctx.textAlign='right'; ctx.fillText(P2.name,W-24,20); ctx.textAlign='left';
  for(const [f,side] of [[P1,'L'],[P2,'R']]){ if(f.tier>0||f.overcharge>2){ ctx.textAlign=side==='L'?'left':'right';
    ctx.font='700 12px ui-monospace,monospace'; ctx.fillStyle=f.overcharge>2?'#ffe07a':'#9fd0ff';
    const t=f.overcharge>2?'SURGE':'CHARGE '+f.tier; ctx.fillText(t, side==='L'?24:W-24, 88); ctx.textAlign='left'; } } }

function render(){ const v=view(); ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.translate(v.ox,v.oy); ctx.scale(v.s,v.s); ctx.beginPath(); ctx.rect(0,0,W,H); ctx.clip();
  const sx=shake?(Math.random()*2-1)*shake:0, sy=shake?(Math.random()*2-1)*shake:0; ctx.translate(sx,sy);
  drawBG(); drawTerrain();
  for(const p of projectiles){ for(let i=3;i>=1;i--){ ctx.fillStyle=hexa(p.c,0.14*i); ctx.beginPath(); ctx.arc(p.x-p.vx*0.006*i,p.y,p.r+i*3,0,7); ctx.fill(); }
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x,p.y,p.r*0.55,0,7); ctx.fill();
    ctx.globalAlpha=0.75; ctx.fillStyle=hexa(p.c,0.9); ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1; }
  P2.draw(); P1.draw(); drawBeam(P2); drawBeam(P1);
  for(const s of sparks){ ctx.globalAlpha=Math.max(0,1-s.t/s.life); ctx.fillStyle=s.c; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill(); } ctx.globalAlpha=1;
  if(flashScreen>0){ ctx.fillStyle=hexa('#ffffff',flashScreen*0.4); ctx.fillRect(0,0,W,H); }
  drawHUD();
  if(state==='playing'&&introT>0) drawCenter([{t:'ROUND START',f:'700 46px ui-monospace,monospace',c:'#ffe07a',y:H/2}]);
  if(state==='title'){ ctx.fillStyle='rgba(8,10,20,.55)'; ctx.fillRect(0,0,W,H); drawCenter([
    {t:'KI  BLOBS',f:'800 72px ui-monospace,monospace',c:'#ffe27a',y:190},
    {t:'AERIAL BRAWL',f:'700 26px ui-monospace,monospace',c:'#7ad0ff',y:230},
    {t:'Fly · Punch · Charge to SURGE · Blast · BEAM · Block',f:'500 17px ui-monospace,monospace',c:'#c7d0ee',y:300},
    {t:'Destructible terrain · momentum slams',f:'500 15px ui-monospace,monospace',c:'#8fa0c8',y:326},
    {t:'PRESS SPACE / TAP A BUTTON TO FIGHT',f:'700 20px ui-monospace,monospace',c:'#fff',y:384}]); }
  if(state==='ko'){ ctx.fillStyle='rgba(8,10,20,.5)'; ctx.fillRect(0,0,W,H); const win=winner===P1; drawCenter([
    {t:win?'K.O. — YOU WIN!':'K.O. — YOU LOSE',f:'800 58px ui-monospace,monospace',c:win?'#5fe08a':'#ff6a7a',y:H/2-10},
    {t:koTimer>0.8?'PRESS SPACE / TAP TO REMATCH':'...',f:'700 20px ui-monospace,monospace',c:'#fff',y:H/2+40}]); }
  ctx.restore(); }

// ============================================================= LOOP
let last=performance.now();
function frame(now){ let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05; update(dt); render(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
})();
</script>
